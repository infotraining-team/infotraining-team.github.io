<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<blockquote>
<p>Współbieżność (concurrency) polega na zarządzaniu wieloma rzeczami naraz.<br />
Równoległość (parallelism) polega na robieniu wielu rzeczy naraz.<br />
To nie to samo, ale są powiązane.<br />
Jedno dotyczy struktury, drugie wykonania.<br />
Współbieżność zapewnia sposób strukturyzacji rozwiązania problemu, który może (ale nie musi) być zrównoleglony.</p>
</blockquote>
<blockquote>
<p><em>Rob Pike, współtwórca języka Go</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="opcje-wsp%C3%B3%C5%82bie%C5%BCno%C5%9Bci-w-pythonie">Opcje współbieżności w Pythonie</h2>
<ul>
<li>
<p><strong>wątki</strong> - biblioteki <code>threading</code> lub <code>concurrent.futures</code></p>
</li>
<li>
<p><strong>podprocesy</strong> - <code>multiprocessing</code> lub <code>concurrent.futures.ProcessPoolExecutor</code></p>
</li>
<li>
<p><strong>asynchroniczne I/O</strong> - najnowszy dodatek do Pythona, asynchroniczne operacje wejścia/wyjścia przy użyciu biblioteki <code>asyncio</code></p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

}
" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="w%C4%85tki-zaletywady">Wątki zalety/wady</h2>
<p>Zalety:</p>
<ul>
<li><strong>dostępność</strong> - wszechobecne</li>
</ul>
<p>Wady:</p>
<ul>
<li>
<p><strong>bezpieczeństwo</strong> - wątki mogą powodować pewne(!) nieoczekiwane zachowania</p>
</li>
<li>
<p><strong>GIL:</strong> - Global Interpreter Lock czyni je bezużytecznymi dla aplikacji obciążających CPU (CPU-bound)</p>
</li>
<li>
<p><strong>zużycie pamięci</strong> - każdy wątek zużywa 8MB RAM</p>
</li>
<li>
<p><strong>czas uruchomienia</strong> - OS potrzebuje czasu na utworzenie wątku</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h3 id="gil">GIL</h3>
<p>Global Interpreter Lock:</p>
<ul>
<li>jeden dla instancji interpretera</li>
<li>przy używaniu wątków (<code>threading</code>) jesteśmy ograniczeni do jednego CPU z powodu blokowania</li>
<li>blokada jest zwalniana:
<ul>
<li>co 5ms</li>
<li>przez niektóre funkcje - I/O, <code>time.sleep()</code>, <code>numpy</code> itp.</li>
</ul>
</li>
</ul>
<p>W praktyce, przy używaniu wątków <strong>GIL nie wpływa na wydajność I/O, ale kod <em>CPU-bound</em> jest w zasadzie jednowątkowy</strong>.</p>
<p>Od Pythona 3.13 pojawia się jako opcja nowy interpreter bez GIL - <strong>freethreaded</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

}
" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="procesy-zaletywady">Procesy zalety/wady</h2>
<p>Zalety:</p>
<ul>
<li><strong>nie dotyczy ich GIL</strong> - idealne do zadań CPU-bound</li>
</ul>
<p>Wady:</p>
<ul>
<li>
<p><strong>narzut komunikacyjny</strong> - znaczący w niektórych przypadkach</p>
</li>
<li>
<p><strong>zużycie pamięci</strong> - podobne do wątków (typowo 8MB)</p>
</li>
<li>
<p><strong>czas uruchomienia</strong> - nawet większy niż w przypadku wątków</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="asynchroniczne-io">Asynchroniczne I/O</h2>
<ul>
<li>model jednowątkowy, jednoprocesowy</li>
<li><em>wielozadaniowość kooperacyjna</em></li>
<li>nie używa wątków/procesów, ale może z nimi współpracować</li>
<li>używa funkcji &quot;zawieszalnych&quot;, które mogą czekać na operacje I/O</li>
<li>podczas oczekiwania inne funkcje mogą być wykonywane/zaplanowane do uruchomienia</li>
</ul>
</section>

<h2 id="korutyny">Korutyny</h2>
<p>Python 3.5 wprowadził specjalne obiekty/funkcje, zwane <strong>korutynami</strong> - <strong>coroutines</strong>.</p>
<p>Korutyny pozwalają napisać funkcję, która nie blokuje podczas oczekiwania na wynik na operacje I/O.</p>
<p>Są podobne do &quot;zwykłych&quot; funkcji lub generatorów.</p>
<p>Specjalny obiekt/zarządca, zwany &quot;pętlą&quot; (<strong>loop</strong>), jest używany do ich uruchamiania i synchronizowania.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="witaj-async">Witaj async</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> asyncio

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">0</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-number">42</span>

res = asyncio.run(main())
<span class="hljs-built_in">print</span>(res)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="uruchamianie-korutyn">Uruchamianie korutyn</h2>
<p><code>async def</code> - natywna korutyna | asynchroniczny generator</p>
<p><code>await</code> - punkt, w którym wykonanie jest wstrzymywane, pętla przejmuje kontrolę, a korutyna czeka na wynik</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">g</span>():
    r = <span class="hljs-keyword">await</span> f()
    <span class="hljs-keyword">return</span> r
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>

<p><img src="imgs/event_loop.png" alt="" style="width:600px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="s%C5%82owo-kluczowe-async">Słowo kluczowe <code>async</code></h2>
<p><code>async def</code> definiuje korutynę, w ciele można używać <code>await</code>, <code>return</code> lub <code>yield</code></p>
<ul>
<li><code>await</code> i/lub <code>return</code> - korutyna</li>
<li><code>yield</code> - asynchroniczny generator (przestarzałe)</li>
</ul>
<p><code>await</code> może być używane tylko w korutynach</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="s%C5%82owo-kluczowe-await">słowo kluczowe <code>await</code></h2>
<p>Nowe słowo kluczowe await zawsze przyjmuje parametr i zaakceptuje tylko obiekt, który jest awaitable (oczekiwalny), co definiuje się jako jeden z poniższych:</p>
<ul>
<li>Korutyna (tj. wynik wywołania funkcji async def)</li>
<li>Dowolny obiekt implementujący metodę specjalną <code>__await__()</code> zwracającą iterator</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_data</span>():
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">1.0</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-number">42</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">process_data</span>():
    result = <span class="hljs-keyword">await</span> get_data()
    <span class="hljs-keyword">return</span> result * <span class="hljs-number">2</span>

asyncio.run(process_data())
<span class="hljs-comment">## returns 84</span>
</code></pre>
<p>Note: Przykład - synchronicznie vs asynchronicznie</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="korutyny---przyk%C5%82ady">Korutyny - Przykłady</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">coro</span>(<span class="hljs-params">x</span>):
    y = <span class="hljs-keyword">await</span> another_coro(x)  <span class="hljs-comment"># OK</span>
    <span class="hljs-keyword">return</span> y

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">async_gen</span>(<span class="hljs-params">a</span>):
    <span class="hljs-keyword">yield</span> a  <span class="hljs-comment"># OK - generator asynchroniczny</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">bad_gen</span>(<span class="hljs-params">x</span>):
    <span class="hljs-keyword">yield</span> <span class="hljs-keyword">from</span> gen(x)  <span class="hljs-comment"># SyntaxError</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">bad_function</span>(<span class="hljs-params">x</span>):
    y = <span class="hljs-keyword">await</span> coro(x)  <span class="hljs-comment"># SyntaxError - brak `async def`</span>
    <span class="hljs-keyword">return</span> y
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">coroutine</span>(<span class="hljs-params">*args, **kwargs</span>):
    <span class="hljs-keyword">pass</span>

<span class="hljs-keyword">assert</span> asyncio.iscoroutine(coroutine())
<span class="hljs-keyword">assert</span> asyncio.iscoroutinefunction(coroutine)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="koncepcja-awaitable">koncepcja <code>awaitable</code></h2>
<p>Użycie <code>await</code> jest możliwe tylko wtedy, gdy po prawej stronie znajduje się obiekt <code>awaitable</code>.</p>
<ul>
<li><code>async def</code> korutyna</li>
<li><code>Tasks</code> - utworzone przez <code>asyncio.create_task()</code></li>
<li><code>Futures</code> - proxy dla przyszłych wyników</li>
</ul>
<p>Można sprawdzić:<br />
<code>inspect.isawaitable</code></p>
</section>

<h2 id="asynciorun"><code>asyncio.run</code></h2>
<p><em>od Pythona 3.7</em></p>
<p>Powinno być używane jako <strong>główny punkt wejścia dla programów asyncio</strong> i idealnie powinno być wywoływane tylko raz.</p>
<p>Ta funkcja uruchamia przekazaną korutynę, zajmując się zarządzaniem pętlą zdarzeń asyncio, finalizowaniem generatorów asynchronicznych i zamykaniem puli wątków.</p>
<p>Ta funkcja zawsze tworzy nową pętlę zdarzeń i zamyka ją na końcu.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">coro</span>():
   <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">1</span>)
   <span class="hljs-keyword">return</span> <span class="hljs-number">1</span>

asyncio.run(coro())
</code></pre>
</section>

<h2 id="asyncio-socket-streams"><code>asyncio</code> socket streams</h2>
<p>Strumienie to wysokopoziomowe typy do pracy z połączeniami sieciowymi z użyciem <code>asyncio</code>. Strumienie pozwalają wysyłać i odbierać dane bez użycia callbacków czy niskopoziomowych protokołów i transportów.</p>
<p><code>asyncio.open_connection()</code> - Nawiązuje połączenie sieciowe i zwraca parę obiektów (reader, writer)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">reader, writer = <span class="hljs-keyword">await</span> asyncio.open_connection(
        <span class="hljs-string">&#x27;127.0.0.1&#x27;</span>, <span class="hljs-number">8888</span>)

data = <span class="hljs-keyword">await</span> reader.read(<span class="hljs-number">100</span>)
writer.write(data)
<span class="hljs-keyword">await</span> writer.drain()
writer.close()
</code></pre>
<p>asyncio.start_server - Uruchamia serwer gniazd</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">server = <span class="hljs-keyword">await</span> asyncio.start_server(
        handle_coroutine, <span class="hljs-string">&#x27;127.0.0.1&#x27;</span>, <span class="hljs-number">8888</span>)
<span class="hljs-keyword">await</span> server.serve_forever()
</code></pre>
</section>

<h2 id="p%C4%99tla-zdarze%C5%84-w-asyncio">Pętla zdarzeń w asyncio</h2>
<ul>
<li>obsługuje całe przełączanie między korutynami</li>
<li>wyłapuje wyjątki StopIteration</li>
<li>i więcej (np. nasłuchiwanie na gniazdach i deskryptorach plików w poszukiwaniu zdarzeń)</li>
</ul>
<p>Istnieją dwa sposoby na uzyskanie pętli zdarzeń:</p>
<ul>
<li>
<p>Zalecany - od Pythona 3.7</p>
<p><code>asyncio.get_running_loop()</code></p>
<p>wywoływalne z wewnątrz kontekstu korutyny</p>
<p>dostarcza aktualnie działającą pętlę zdarzeń</p>
</li>
</ul>
</section>

<h2 id="p%C4%99tla-zdarze%C5%84-w-asyncio-1">Pętla zdarzeń w asyncio</h2>
<ul>
<li>
<p><code>asyncio.get_event_loop()</code></p>
<p>wywoływalne skądkolwiek</p>
<p>Od Pythona 3.10: <strong>Deprecated</strong>, jeśli nie ma uruchomionej pętli zdarzeń. Zwraca bieżącą pętlę.</p>
</li>
<li>
<p><code>ayncio.new_event_loop()</code></p>
<p>tworzy nową instancję pętli zdarzeń</p>
</li>
</ul>
<p>Introspekcja:</p>
<ul>
<li><code>loop.is_running()</code></li>
<li><code>loop.is_closed()</code></li>
</ul>

<h3 id="uruchomienie-korutyny---przed-pythonem-37">Uruchomienie korutyny - przed Pythonem 3.7</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">loop = asyncio.get_event_loop()
<span class="hljs-keyword">try</span>:
    loop.run_until_complete(main())
<span class="hljs-keyword">finally</span>:
    loop.close()

</code></pre>

<h2 id="runners--co-to-jest"><code>Runners</code> — co to jest?</h2>
<ul>
<li>&quot;Runner&quot; to wzorzec uruchamiania korutyn i zarządzania pętlą zdarzeń.</li>
<li><code>asyncio.run()</code> jest standardowym runnerem: tworzy pętlę, uruchamia korutynę, zamyka pętlę i finalizuje zasoby.</li>
<li>Można napisać własny runner, jeśli potrzebujesz niestandardowego cyklu życia pętli (np. REPL, testy, embed).</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Najprostszy runner: asyncio.run(coro())</span>
res = asyncio.run(main())
</code></pre>
</section>

<h2 id="w%C5%82asny-runner-i-przypadki-u%C5%BCycia">Własny runner i przypadki użycia</h2>
<ul>
<li>Tworzenie własnej pętli: <code>loop = asyncio.new_event_loop()</code> + <code>loop.run_until_complete(...)</code> — przydatne przy osadzaniu asyncio w innych środowiskach (wątkach, aplikacjach REPL).</li>
<li>Uważaj na wielokrotne użycie tej samej pętli i na zamykanie pętli (<code>loop.close()</code>) — <code>asyncio.run()</code> robi to za Ciebie.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">loop = asyncio.new_event_loop()
<span class="hljs-keyword">try</span>:
    loop.run_until_complete(main())
<span class="hljs-keyword">finally</span>:
    loop.close()
</code></pre>
</section>

<h2 id="future">Future</h2>
<p><code>Future</code> to klasa reprezentująca stan czegoś, co wchodzi w interakcję z pętlą</p>
<ul>
<li>
<p>zapewnia bezpieczny kanał do przekazania ostatecznego wyniku jakiejś aktywności:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">f.set_result(value)  <span class="hljs-comment"># ustawia wartość</span>
f.result()           <span class="hljs-comment"># pobiera ją</span>
</code></pre>
</li>
<li>
<p>wspiera mechanizm anulowania</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>f.cancel()
f.cancelled()  # sprawdza czy akcja została anulowana
f.done()       # sprawdza stan ukończenia
</code></pre>
</li>
<li>
<p>wspiera kontynuacje poprzez ustawienie dodatkowych callbacków, które zostaną uruchomione, gdy future się zakończy</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

}
" lang="C" data-marpit-pagination="31" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

}

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> asyncio <span class="hljs-keyword">import</span> Future

f = Future()
f.done()

<span class="hljs-comment">## False</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>(<span class="hljs-params">f: asyncio.Future</span>):
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">1</span>)
    f.set_result(<span class="hljs-string">&#x27;Skończyłem&#x27;</span>)

f = asyncio.Future()
f.done()

<span class="hljs-comment">## False</span>

<span class="hljs-keyword">await</span> main(f)
f.done()
</code></pre>
</section>

<h2 id="task">Task</h2>
<ul>
<li>
<p><code>Task</code> to podklasa <code>Future</code></p>
</li>
<li>
<p>Reprezentuje uruchomioną korutynę</p>
</li>
<li>
<p>Od Pythona 3.8 nie wolno wywoływać set_result() na Task - próba zgłosi RuntimeError</p>
<hr />
</li>
</ul>
<h3 id="tworzenie-zada%C5%84">Tworzenie zadań</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">asyncio.create_task(some_coroutine(i))
</code></pre>

<h2 id="asynccreate_task"><code>async.create_task()</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">coro</span>():
    <span class="hljs-built_in">print</span>(<span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">1</span>, result=<span class="hljs-string">&quot;finished!&quot;</span>))

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    task = asyncio.create_task(coro())
    <span class="hljs-keyword">await</span> task

asyncio.run(main())
</code></pre>

<h2 id="asyncioensure_future"><code>asyncio.ensure_future()</code></h2>
<p><code>asyncio.ensure_future(coro_or_future, *, loop=None)</code> to funkcja, która pozwala opakować korutynę w <code>Task</code></p>
<p>Jeśli przekażesz korutynę, wytworzy instancję <code>Task</code>. Jest to identyczne z wywołaniem <code>asyncio.create_task()</code> i zwróceniem nowej instancji <code>Task</code></p>
<p>Jeśli przekażesz instancję <code>Future</code> (lub instancję <code>Task</code>, ponieważ <code>Task</code> jest podklasą <code>Future</code>), otrzymasz tę samą rzecz z powrotem</p>
<p>To funkcja pomocnicza przeznaczona dla projektantów frameworków</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">f</span>():
    <span class="hljs-keyword">pass</span>

coro = f()
loop = asyncio.get_event_loop()

task = loop.create_task(coro)
<span class="hljs-keyword">assert</span> <span class="hljs-built_in">isinstance</span>(task, asyncio.Task)

new_task = asyncio.ensure_future(coro)
<span class="hljs-keyword">assert</span> <span class="hljs-built_in">isinstance</span>(new_task, asyncio.Task)

guess_what = asyncio.ensure_future(task)
<span class="hljs-keyword">assert</span> guess_what <span class="hljs-keyword">is</span> task

<h1 id="wyj%C4%85tki-w-korutynach">Wyjątki w korutynach</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<h2 id="wyj%C4%85tki-w-korutynach-1">Wyjątki w korutynach</h2>
<ul>
<li>Wyjątek rzucony wewnątrz korutyny propaguje się do miejsca, które ją <code>await</code>uje.</li>
<li>Jeśli korutyna nie jest <code>await</code>owana (np. uruchomiona jako <code>Task</code>), wyjątek może pozostać nieobsłużony i zostać zalogowany jako ostrzeżenie.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">bad</span>():
    <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;Sonething is wrong!&quot;</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    <span class="hljs-keyword">await</span> bad()  <span class="hljs-comment"># wyjątek przerywa main i przepływa na zewnątrz</span>

asyncio.run(main())
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="wyj%C4%85tki-w-task">Wyjątki w <code>Task</code></h2>
<ul>
<li>Jeśli nie wywołasz <code>await task</code>, jego wyjątek nie zostanie automatycznie podniesiony w kodzie wywołującym.</li>
<li>Niezłapane wyjątki w <code>Task</code> skutkują logiem: &quot;Task exception was never retrieved&quot;.</li>
<li>Sposoby obsługi: <code>await task</code>, <code>task.add_done_callback(...)</code>, sprawdzenie <code>task.exception()</code>.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">bad</span>():
    <span class="hljs-keyword">raise</span> RuntimeError(<span class="hljs-string">&quot;oops&quot;</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    t = asyncio.create_task(bad())
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">0.1</span>)
    <span class="hljs-comment"># if not await t, only goes to log</span>

asyncio.run(main())
</code></pre>
</section>

<h2 id="task---obs%C5%82uga-b%C5%82%C4%99d%C3%B3w"><code>Task</code> - obsługa błędów</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">faulty_task</span>():
    <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;Something went wrong!&quot;</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    task = asyncio.create_task(faulty_task())

    <span class="hljs-keyword">try</span>:
        <span class="hljs-keyword">await</span> task
    <span class="hljs-keyword">except</span> ValueError <span class="hljs-keyword">as</span> e:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Caught error: <span class="hljs-subst">{e}</span>&quot;</span>)

asyncio.run(main())
</code></pre>
<p>Błąd zostaje złapany i obsłużony w bloku try-except, po wywołaniu <code>await task</code>.</p>

<h2 id="task---callback"><code>Task</code> - callback</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">task_done_callback</span>(<span class="hljs-params">task</span>):
    <span class="hljs-keyword">try</span>:
        result = task.result()
    <span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> e:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Task raised an exception: <span class="hljs-subst">{e}</span>&quot;</span>)
    <span class="hljs-keyword">else</span>:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Task completed with result: <span class="hljs-subst">{result}</span>&quot;</span>)
<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">faulty_task</span>():
    <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;Something went wrong!&quot;</span>)
<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    task = asyncio.create_task(faulty_task())
    task.add_done_callback(task_done_callback)
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">0.1</span>)  <span class="hljs-comment"># wait for task to complete</span>
asyncio.run(main())
</code></pre>
<p>Użycie callbacku pozwala obsłużyć wyjątek bez konieczności <code>await</code>owania zadania.</p>
</section>

<h2 id="wiele-korutyn---gather">Wiele korutyn - <code>gather</code></h2>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">coro</span>(<span class="hljs-params">text, res</span>):
    <span class="hljs-built_in">print</span>(<span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">1</span>, text))
    <span class="hljs-keyword">return</span> result

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    workload = [
        coro(<span class="hljs-string">&quot;after 1 second&quot;</span>,<span class="hljs-number">1</span>),
        coro(<span class="hljs-string">&quot;after 1 second&quot;</span>,<span class="hljs-number">2</span>),
        coro(<span class="hljs-string">&quot;after 1 second&quot;</span>,<span class="hljs-number">3</span>),
    ]
    results = <span class="hljs-keyword">await</span> asyncio.gather(*workload)
    <span class="hljs-built_in">print</span>(results)

asyncio.run(main())

<h2 id="task-groups-python-311">Task Groups (Python 3.11+)</h2>
<p><code>asyncio.TaskGroup</code> to nowoczesny sposób zarządzania grupą powiązanych zadań (Structured Concurrency).</p>
<p>Gwarantuje, że jeśli jedno zadanie zakończy się błędem, pozostałe zostaną anulowane.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    <span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> asyncio.TaskGroup() <span class="hljs-keyword">as</span> tg:
        tg.create_task(coro1())
        tg.create_task(coro2())
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Wszystkie zadania zakończone (lub anulowane)&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<h2 id="taskgroup-vs-gather">TaskGroup vs gather</h2>
<table>
<thead>
<tr>
<th>Cecha</th>
<th><code>asyncio.gather</code></th>
<th><code>asyncio.TaskGroup</code></th>
</tr>
</thead>
<tbody>
<tr>
<td>Dostępność</td>
<td>Od Python 3.4</td>
<td>Od Python 3.11</td>
</tr>
<tr>
<td>Obsługa błędów</td>
<td>Zwraca wyjątek lub listę wyników</td>
<td>Podnosi <code>ExceptionGroup</code></td>
</tr>
<tr>
<td>Anulowanie</td>
<td>Ręczne zarządzanie, trudne</td>
<td>Automatyczne anulowanie rodzeństwa przy błędzie</td>
</tr>
<tr>
<td>Styl</td>
<td>Funkcyjny</td>
<td>Context Manager (Structured Concurrency)</td>
</tr>
</tbody>
</table>
<p>Zaleca się używanie <code>TaskGroup</code> w nowym kodzie (Python 3.11+).</p>
</section>

<h2 id="obs%C5%82uga-b%C5%82%C4%99d%C3%B3w-gather-i-taskgroup">Obsługa błędów: <code>gather</code> i <code>TaskGroup</code></h2>
<ul>
<li><code>asyncio.gather(..., return_exceptions=True)</code> zwraca wyjątki jako wyniki, co pozwala kontynuować działanie.</li>
<li><code>asyncio.TaskGroup</code> (Python 3.11+) stosuje structured concurrency — przy błędzie jeden task powoduje anulowanie rodzeństwa i podnosi <code>ExceptionGroup</code>.</li>
<li>Preferuj <code>TaskGroup</code> w nowym kodzie; użyj <code>except*</code> do rozdzielenia typów wyjątków.</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># gather + return_exceptions</span>
results = <span class="hljs-keyword">await</span> asyncio.gather(a(), b(), return_exceptions=<span class="hljs-literal">True</span>)

<span class="hljs-comment"># TaskGroup (3.11+)</span>
<span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> asyncio.TaskGroup() <span class="hljs-keyword">as</span> tg:
    tg.create_task(a())
    tg.create_task(b())
<span class="hljs-comment"># błędy są zebrane i podniesione jako ExceptionGroup</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="gather-z-return_exceptionstrue"><code>gather</code> z <code>return_exceptions=True</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">results = <span class="hljs-keyword">await</span> asyncio.gather(
    task1(),
    task2(),
    return_exceptions=<span class="hljs-literal">True</span>
)

<span class="hljs-keyword">for</span> result <span class="hljs-keyword">in</span> results:
    <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(result, Exception):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Złapano wyjątek: <span class="hljs-subst">{result}</span>&quot;</span>)
    <span class="hljs-keyword">else</span>:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Wynik: <span class="hljs-subst">{result}</span>&quot;</span>)
</code></pre>

<h2 id="taskgroup---obs%C5%82uga-b%C5%82%C4%99d%C3%B3w">TaskGroup - obsługa błędów</h2>
<p>Błędy w <code>TaskGroup</code> są zbierane w <code>ExceptionGroup</code> (Python 3.11+).</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">try</span>:
    <span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> asyncio.TaskGroup() <span class="hljs-keyword">as</span> tg:
        tg.create_task(task1())
        tg.create_task(task2())
<span class="hljs-keyword">except</span>* ValueError <span class="hljs-keyword">as</span> eg:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Złapano błędy ValueError: <span class="hljs-subst">{eg.exceptions}</span>&quot;</span>)
<span class="hljs-keyword">except</span>* TypeError <span class="hljs-keyword">as</span> eg:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Złapano błędy TypeError: <span class="hljs-subst">{eg.exceptions}</span>&quot;</span>)
</code></pre>
<p>Konstrukcja <code>except*</code> pozwala obsługiwać grupy wyjątków.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<h2 id="wiele-korutyn---wait">Wiele korutyn - <code>wait</code></h2>
<p>Użyj <code>asyncio.wait(iterable, timeout, return_when)</code>, aby uruchomić obiekty awaitable z iterable i zablokować do czasu spełnienia warunku określonego przez return_when.</p>
<p><code>retun_when</code> = FIRST_COMPLETED | FIRST_EXCEPTION | ALL_COMPLETED</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">done, pending = <span class="hljs-keyword">await</span> asyncio.wait(aws, timeout=<span class="hljs-number">5</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;

" lang="C" data-marpit-pagination="50" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="asynciowait---przyk%C5%82ad"><code>asyncio.wait</code> - przykład</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">coro</span>(<span class="hljs-params"><span class="hljs-built_in">id</span>, delay</span>):
    <span class="hljs-keyword">await</span> asyncio.sleep(delay)
    <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;coro <span class="hljs-subst">{<span class="hljs-built_in">id</span>}</span> finished after <span class="hljs-subst">{delay}</span> seconds&quot;</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    aws = [coro(i, i) <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">5</span>)]
    done, pending = <span class="hljs-keyword">await</span> asyncio.wait(aws, return_when=asyncio.FIRST_COMPLETED)

    <span class="hljs-keyword">for</span> task <span class="hljs-keyword">in</span> done:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Completed: <span class="hljs-subst">{task.result()}</span>&quot;</span>)
    <span class="hljs-keyword">for</span> task <span class="hljs-keyword">in</span> pending:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Pending: <span class="hljs-subst">{task}</span>&quot;</span>)
asyncio.run(main())
</code></pre>
</section>

<h2 id="asynciowait---obs%C5%82uga-b%C5%82%C4%99d%C3%B3w"><code>asyncio.wait</code> - obsługa błędów</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">faulty_task</span>():
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">0.5</span>)
    <span class="hljs-keyword">raise</span> ValueError(<span class="hljs-string">&quot;Something went wrong in the task!&quot;</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    <span class="hljs-keyword">try</span>:
        <span class="hljs-keyword">await</span> asyncio.wait_for(faulty_task(), timeout=<span class="hljs-number">2.0</span>)
    <span class="hljs-keyword">except</span> asyncio.TimeoutError:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Timeout&quot;</span>)
    <span class="hljs-keyword">except</span> ValueError <span class="hljs-keyword">as</span> e:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Error from the Task: <span class="hljs-subst">{e}</span>&quot;</span>)
</code></pre>

<h2 id="wiele-korutyn---as_completed">Wiele korutyn - <code>as_completed</code></h2>

<p>Każda zwrócona korutyna może być oczekiwana (awaited), aby uzyskać najwcześniejszy następny wynik z iterable pozostałych obiektów awaitable.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">for</span> coro <span class="hljs-keyword">in</span> asyncio.as_completed(aws):

    <span class="hljs-comment"># ...</span>
</code></pre>

<h2 id="taskcancel"><code>task.cancel()</code></h2>
<p>Zadanie uruchomione w pętli może zostać anulowane</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">cancellable</span>(<span class="hljs-params">delay=<span class="hljs-number">10</span></span>):
    loop = asyncio.get_running_loop()
    <span class="hljs-keyword">try</span>:
        now = loop.time()
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Sleeping from <span class="hljs-subst">{now}</span> for <span class="hljs-subst">{delay}</span> seconds ...&quot;</span>)
        <span class="hljs-keyword">await</span> asyncio.sleep(delay, loop=loop)
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Slept <span class="hljs-subst">{delay}</span> seconds ...&quot;</span>)
    <span class="hljs-keyword">except</span> asyncio.CancelledError:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Cancelled at <span class="hljs-subst">{now}</span> after <span class="hljs-subst">{loop.time()-now}</span> seconds&quot;</span>)
<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    coro = cancellable()
    task = asyncio.create_task(coro)
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">3</span>)
    task.cancel()
asyncio.run(main())
</code></pre>
</section>

<p>użyj:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">prot_task = asyncio.shield(coro)
</code></pre>
<p>zamiast:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">unprot_task = asyncio.create_task(coro)
</code></pre>
<blockquote>
<p><strong>Uwaga</strong>: Anulowanie <code>prot_task</code> (tarczy) nie anuluje <code>coro</code> (zadania wewnątrz). <code>coro</code> będzie kontynuowane w tle, ale <code>prot_task</code> zgłosi <code>CancelledError</code>.</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    task = asyncio.create_task(slow_task())

    <span class="hljs-keyword">try</span>:
        <span class="hljs-comment"># Use shield to protect the task from cancellation</span>
        <span class="hljs-comment"># task is still running in the background</span>
        <span class="hljs-keyword">await</span> asyncio.wait_for(asyncio.shield(task), timeout=<span class="hljs-number">1.0</span>)
    <span class="hljs-keyword">except</span> asyncio.TimeoutError:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;Stop waiting, but...&quot;</span>)
        <span class="hljs-comment"># task still runs in the background</span>
        <span class="hljs-keyword">await</span> task  <span class="hljs-comment"># wait for the task later</span>
asyncio.run(main())
</code></pre>

<h2 id="debugowanie-asyncio">Debugowanie Asyncio</h2>
<p>Asyncio posiada wbudowany tryb debugowania, który pomaga wykrywać typowe problemy:</p>
<ul>
<li>Korutyny, które zostały utworzone, ale nie były oczekiwane (<code>await</code>).</li>
<li>Operacje I/O zajmujące zbyt dużo czasu.</li>
<li>Wyjątki, które nie zostały obsłużone.</li>
</ul>
<p>Aktywacja:</p>
<ol>
<li>Zmienna środowiskowa: <code>PYTHONASYNCIODEBUG=1</code></li>
<li>W kodzie: <code>asyncio.run(main(), debug=True)</code></li>
</ol>
<p>W trybie debugowania <code>asyncio</code> loguje więcej szczegółów na temat wykonywanych zadań.</p>
</section>

<h2 id="asynchroniczne-iteratory---async-for">Asynchroniczne iteratory - <code>async for</code></h2>
<p>Asynchroniczne iteratory wymagają zaimplementowania kilku magicznych metod</p>
<ul>
<li>
<p><code>def __aiter__()</code> musi zwrócić obiekt implementujący <code>async def __next__()</code></p>
</li>
<li>
<p><code>__anext__()</code> musi zwrócić wartość dla każdej iteracji i zgłosić <code>StopAsyncIteration</code> po zakończeniu</p>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">OneAtATime</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, redis, keys</span>):
        <span class="hljs-variable language_">self</span>.redis = redis
        <span class="hljs-variable language_">self</span>.keys = keys

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__aiter__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-variable language_">self</span>.ikeys = <span class="hljs-built_in">iter</span>(<span class="hljs-variable language_">self</span>.keys)
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>

    <span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">__anext__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-keyword">try</span>:
            k = <span class="hljs-built_in">next</span>(<span class="hljs-variable language_">self</span>.ikeys)
        <span class="hljs-keyword">except</span> StopIteration:
            <span class="hljs-keyword">raise</span> StopAsyncIteration

        value = <span class="hljs-keyword">await</span> <span class="hljs-variable language_">self</span>.redis.get(k)
        <span class="hljs-keyword">return</span> (k, value)
</code></pre>

<h2 id="asynchroniczne-generatory">Asynchroniczne generatory</h2>
<ul>
<li>Asynchroniczne generatory to funkcje <code>async def</code>, które mają wewnątrz słowa kluczowe <code>yield</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">one_at_a_time</span>(<span class="hljs-params">redis, keys</span>):
    <span class="hljs-keyword">for</span> key <span class="hljs-keyword">in</span> keys:
        value = <span class="hljs-keyword">await</span> redis.get(key)
        <span class="hljs-keyword">yield</span> key, value

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">worker</span>(<span class="hljs-params"><span class="hljs-built_in">id</span></span>):
    redis = <span class="hljs-keyword">await</span> create_redis((<span class="hljs-string">&#x27;localhost&#x27;</span>, <span class="hljs-number">6379</span>))
    <span class="hljs-keyword">async</span> <span class="hljs-keyword">for</span> key, value <span class="hljs-keyword">in</span> one_at_a_time(redis, keys):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&#x27;#<span class="hljs-subst">{<span class="hljs-built_in">id</span>}</span>: <span class="hljs-subst">{key}</span> - <span class="hljs-subst">{value}</span>&#x27;</span>)
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">worker</span>():

<h2 id="contextvars">ContextVars</h2>
<p>W <code>asyncio</code> nie używamy <code>threading.local()</code>, ponieważ wiele zadań działa w jednym wątku. Zamiast tego używamy <code>contextvars</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> contextvars
<span class="hljs-keyword">from</span> asyncio <span class="hljs-keyword">import</span> create_task, sleep

user_ctx = contextvars.ContextVar(<span class="hljs-string">&quot;user_ctx&quot;</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">task</span>(<span class="hljs-params">name</span>):
    user_ctx.<span class="hljs-built_in">set</span>(name)
    <span class="hljs-keyword">await</span> sleep(<span class="hljs-number">0.1</span>)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Task <span class="hljs-subst">{name}</span>: <span class="hljs-subst">{user_ctx.get()}</span>&quot;</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    <span class="hljs-keyword">await</span> asyncio.gather(task(<span class="hljs-string">&quot;A&quot;</span>), task(<span class="hljs-string">&quot;B&quot;</span>))

<span class="hljs-comment"># Output:</span>
<span class="hljs-comment"># Task A: A</span>
<span class="hljs-comment"># Task B: B</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<h2 id="async-with---asynchroniczne-mened%C5%BCery-kontekstu"><code>async with</code> - asynchroniczne menedżery kontekstu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Perform some IO operations synchronously</span>
<span class="hljs-keyword">with</span> RemoteResource(*some_parameters) <span class="hljs-keyword">as</span> connection:
    connection.send(some_data)
    new_data = connection.recv()

<span class="hljs-comment"># Perform the same IO operations asynchronously</span>
<span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> RemoteResource(*some_parameters) <span class="hljs-keyword">as</span> connection:
    <span class="hljs-keyword">await</span> connection.send(some_data)
    new_data = <span class="hljs-keyword">await</span> connection.recv()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<p><strong>Menedżery kontekstu</strong> w wielu scenariuszach wymagają otwierania i zamykania zasobów systemowych (np. połączeń sieciowych) w dobrze zdefiniowanym zakresie.</p>
<p>Asynchroniczne menedżery kontekstu wymagają klauzuli async with</p>
<p>Ich działanie jest sterowane przez korutyny - <code>__aenter__()</code> i <code>__aexit__()</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> AsyncCM <span class="hljs-keyword">as</span> c:
    c.do_something()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="76" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<p>To to samo co:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">c = <span class="hljs-keyword">await</span> AsyncCM.__aenter__()
<span class="hljs-keyword">try</span>:
    c.do_something()
<span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> e:
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-keyword">await</span> AsyncCM.__aexit__(<span class="hljs-built_in">type</span>(e), e, e.__traceback__):
        <span class="hljs-keyword">raise</span> e
<span class="hljs-keyword">else</span>:
    <span class="hljs-keyword">await</span> AsyncCM.__aexit__(<span class="hljs-literal">None</span>, <span class="hljs-literal">None</span>, <span class="hljs-literal">None</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-meta">@asynccontextmanager</span>

<h2 id="asyncioqueue"><code>asyncio.Queue</code></h2>
<p>Kolejki asyncio są zaprojektowane tak, aby były podobne do klas modułu queue.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">worker</span>(<span class="hljs-params">name, queue</span>):
    <span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
        sleep_for = <span class="hljs-keyword">await</span> queue.get()   <span class="hljs-comment"># Jeśli kolejka jest pusta, czekaj</span>
        <span class="hljs-keyword">await</span> asyncio.sleep(sleep_for)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    queue = asyncio.Queue()
    <span class="hljs-keyword">for</span> sleep_for <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">20</span>):
        <span class="hljs-keyword">await</span> queue.put(sleep_for)      <span class="hljs-comment"># Jeśli kolejka jest pełna, czekaj</span>
</code></pre>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">worker</span>(<span class="hljs-params">...</span>)

    <span class="hljs-keyword">finally</span>:

<h2 id="asynciosemaphore"><code>asyncio.Semaphore</code></h2>
<p>Semaphor zarządza wewnętrznym licznikiem, który jest zmniejszany przez każde wywołanie <code>acquire()</code> i zwiększany przez każde wywołanie <code>release()</code>.</p>
<p>Gdy <code>acquire()</code> stwierdzi, że licznik wynosi zero, blokuje się, czekając aż jakieś zadanie wywoła <code>release()</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">sem = asyncio.Semaphore(<span class="hljs-number">10</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> sem:
    <span class="hljs-comment"># work with shared resource</span>
    ...
</code></pre>

;" data-marpit-pagination-total="99" data-size="16:9">

<h2 id="asynciobarrier"><code>asyncio.Barrier</code></h2>
<p>Bariera to prosty prymityw synchronizacji, który pozwala zablokować wykonanie określonej liczby zadań (<code>parties</code>), dopóki wszystkie one nie dotrą do bariery.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">barrier = asyncio.Barrier(<span class="hljs-number">2</span>)

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">worker</span>(<span class="hljs-params"><span class="hljs-built_in">id</span></span>):
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Worker <span class="hljs-subst">{<span class="hljs-built_in">id</span>}</span> waiting...&quot;</span>)
    <span class="hljs-keyword">await</span> barrier.wait()
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Worker <span class="hljs-subst">{<span class="hljs-built_in">id</span>}</span> released!&quot;</span>)

<span class="hljs-keyword">await</span> asyncio.gather(worker(<span class="hljs-number">1</span>), worker(<span class="hljs-number">2</span>))
</code></pre>
<p>To przydatne, gdy musisz zsynchronizować start lub postęp kilku niezależnych zadań.</p>
</section>

<h2 id="transporty-i-protoko%C5%82y">Transporty i Protokoły</h2>
<p>Transporty i Protokoły są używane przez niskopoziomowe API pętli zdarzeń, takie jak <code>loop.create_connection()</code>.<br />
Używają stylu programowania opartego na callbackach i umożliwiają wysokowydajne implementacje protokołów sieciowych lub IPC (np. HTTP).</p>
<p>Zasadniczo, transporty i protokoły <strong>powinny być używane tylko w bibliotekach i frameworkach</strong>, a nigdy w wysokopoziomowych aplikacjach asyncio.</p>
<p>Podstawową funkcjonalność można uzyskać implementując:</p>
<p><code>BaseProtocol.connection_made(transport)</code> - Wywoływane po nawiązaniu połączenia.</p>
<p><code>BaseProtocol.connection_lost(exc)</code> - Wywoływane po utracie lub zamknięciu połączenia.</p>
<p><code>Protocol.data_received(data)</code> - Wywoływane, gdy otrzymano jakieś dane. data to niepusty obiekt bytes zawierający przychodzące dane.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;

" lang="C" data-marpit-pagination="89" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {

<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="przyk%C5%82ad-protoko%C5%82u">Przykład protokołu</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">EchoClientProtocol</span>(asyncio.Protocol):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, message, on_con_lost</span>):
        <span class="hljs-variable language_">self</span>.message = message
        <span class="hljs-variable language_">self</span>.on_con_lost = on_con_lost

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">connection_made</span>(<span class="hljs-params">self, transport</span>):
        transport.write(<span class="hljs-variable language_">self</span>.message.encode())
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;Data sent: {!r}&#x27;</span>.<span class="hljs-built_in">format</span>(<span class="hljs-variable language_">self</span>.message))

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">data_received</span>(<span class="hljs-params">self, data</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;Data received: {!r}&#x27;</span>.<span class="hljs-built_in">format</span>(data.decode()))

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">connection_lost</span>(<span class="hljs-params">self, exc</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;The server closed the connection&#x27;</span>)
        <span class="hljs-variable language_">self</span>.on_con_lost.set_result(<span class="hljs-literal">True</span>)
</code></pre>
</section>

<h2 id="biblioteka-aiofile-vs-aiofiles">biblioteka <code>aiofile</code> vs <code>aiofiles</code></h2>
<p>Istnieją dwie popularne biblioteki o podobnych nazwach:</p>
<ul>
<li><code>aiofiles</code> (liczba mnoga): bardzo popularna, działa w oparciu o pulę wątków (thread pool), co zapewnia szeroką kompatybilność z operacjami wejścia/wyjścia systemu operacyjnego.</li>
<li><code>aiofile</code> (liczba pojedyncza): używa natywnego asynchronicznego I/O (np. <code>kaio</code> na Linuxie).</li>
</ul>
<p>W tym przykładzie używamy <code>aiofile</code>, ale w wielu projektach spotkasz <code>aiofiles</code>.</p>
</section>

<h2 id="biblioteka-aiofile">biblioteka <code>aiofile</code></h2>
<p>Biblioteka do obsługi lokalnych plików dyskowych w aplikacjach asyncio.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> aiofile <span class="hljs-keyword">import</span> async_open
<span class="hljs-keyword">import</span> asyncio

tmp_filename = <span class="hljs-string">&quot;hello.txt&quot;</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">main</span>():
    <span class="hljs-keyword">async</span> <span class="hljs-keyword">with</span> async_open(tmp_filename, <span class="hljs-string">&#x27;w+&#x27;</span>) <span class="hljs-keyword">as</span> afp:
        <span class="hljs-keyword">await</span> afp.write(<span class="hljs-string">&quot;Hello &quot;</span>)
        <span class="hljs-keyword">await</span> afp.write(<span class="hljs-string">&quot;world\n&quot;</span>)
        afp.seek(<span class="hljs-number">0</span>)
        <span class="hljs-built_in">print</span>(<span class="hljs-keyword">await</span> afp.read())

asyncio.run(main())
</code></pre>

<h2 id="fastapi">FastAPI</h2>
<p>FastAPI to nowoczesny, szybki (o wysokiej wydajności) framework webowy do budowania API z użyciem Pythona 3.6+, bazujący na standardowych hintach typów.</p>
<p>Kluczowe cechy:</p>
<ul>
<li><strong>Wydajność</strong>: Jedna z najszybszych dostępnych bibliotek Pythonowych (dzięki Starlette i Pydantic).</li>
<li><strong>Wsparcie Async</strong>: Natywnie obsługuje składnię <code>async</code>/<code>await</code>.</li>
<li><strong>Automatyczna dokumentacja</strong>: Swagger UI i ReDoc generowane automatycznie.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {

;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="fastapi---hello-world">FastAPI - Hello World</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> fastapi <span class="hljs-keyword">import</span> FastAPI
<span class="hljs-keyword">import</span> asyncio

app = FastAPI()

<span class="hljs-meta">@app.get(<span class="hljs-params"><span class="hljs-string">&quot;/&quot;</span></span>)</span>
<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">read_root</span>():
    <span class="hljs-keyword">await</span> asyncio.sleep(<span class="hljs-number">0.1</span>)
    <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;Hello&quot;</span>: <span class="hljs-string">&quot;World&quot;</span>}
</code></pre>
<p>Uruchomienie (wymaga serwera ASGI, np. uvicorn):<br />
<code>uvicorn main:app --reload</code></p>
</section>

<h2 id="fastapi---async-vs-sync">FastAPI - Async vs Sync</h2>
<p>FastAPI inteligentnie zarządza korutynami i funkcjami blokującymi.</p>
<ol>
<li>
<p><strong><code>async def</code></strong>: Używaj, gdy kod wykonuje operacje awaitable (I/O, bazy danych z driverem async). FastAPI uruchomi to bezpośrednio w pętli zdarzeń.</p>
</li>
<li>
<p><strong><code>def</code> (zwykła funkcja)</strong>: Używaj, gdy kod jest blokujący (CPU-bound lub biblioteki non-async). FastAPI uruchomi to w osobnej puli wątków (threadpool), aby nie zablokować głównej pętli.</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="98" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<h2 id="staranowa-sk%C5%82adnia">Stara/nowa składnia</h2>
<p>Od wersji 3.5, Python posiada trzy rodzaje korutyn:</p>
<ul>
<li>natywne korutyny</li>
</ul>
<p>Korutyna zdefiniowana za pomocą async def. Możesz delegować z natywnej korutyny do innej natywnej korutyny lub do korutyny opartej na generatorze używając słowa kluczowego await, podobnie jak klasyczne korutyny używają yield from.</p>
<ul>
<li>korutyny oparte na generatorach (<strong>USUNIĘTE w Python 3.11</strong>)</li>
</ul>
<p>Używały <code>@asyncio.coroutine</code> i <code>yield from</code>. Kod nie zadziała w Pythonie 3.11+.</p>
<ul>
<li>klasyczne korutyny (<strong>USUNIĘTE w Python 3.11</strong>)</li>
</ul>
<p>Funkcje generatora używane jako korutyny. Kod nie zadziała w Pythonie 3.11+.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-header="![width:150px](imgs/logo.png)" data-theme="default" data-style="section {
  font-size: 25px;
}
" lang="C" data-marpit-pagination="99" style="--paginate:true;--header:![width:150px](imgs/logo.png);--theme:default;--style:section {
  font-size: 25px;
}
;" data-marpit-pagination-total="99" data-size="16:9">
<header><img src="imgs/logo.png" alt="" style="width:150px;" /></header>
<p><strong>niekompatybilne już z asyncio</strong></p>
<p>Prawie równoważne:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-meta">@asyncio.coroutine</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">up_to_py34_coro</span>():
    <span class="hljs-string">&quot;&quot;&quot;Generator-based, legacy syntax (REMOVED in 3.11)&quot;&quot;&quot;</span>
    <span class="hljs-comment"># yield from stuff() # SyntaxError in 3.11</span>

<span class="hljs-keyword">async</span> <span class="hljs-keyword">def</span> <span class="hljs-title function_">since_py35_coro</span>():
    <span class="hljs-string">&quot;&quot;&quot;Native coroutine, new syntax&quot;&quot;&quot;</span>
    <span class="hljs-keyword">await</span> stuff()
</code></pre>
